name: Isolated SEO failure recovery watchdog
on:
  workflow_run:
    workflows: [Isolated SEO preparation and recovery]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: fabrya-seo-single-supervisor
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CRASH_PROBE: 'false'
    steps:
      - name: Read own trusted default branch only
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = "sempehugo03-jpg/fabrya-seo-supervisor"
          git init --quiet .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
          unset auth
      - name: Verify recovery executor
        run: python3 -m unittest discover -s tests -v
      - name: Recover same SEO state and unfinished useful task
        run: python3 supervisor.py
