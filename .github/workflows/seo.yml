name: Isolated SEO preparation and recovery
on:
  push:
    branches: [main, seo-wake]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      interruption_test:
        description: One controlled durable interruption, recovered by isolated watchdog
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: fabrya-seo-single-supervisor
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CRASH_PROBE: ${{ inputs.interruption_test == true && 'true' || 'false' }}
      CRASH_PROBE_ID: controlled-interruption-v4
      SEO_WAKE_FILE: /tmp/fabrya-seo-wake.json
    steps:
      - name: Read own repository only
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = "sempehugo03-jpg/fabrya-seo-supervisor"
          git init --quiet .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          if [ "$GITHUB_REF" = refs/heads/seo-wake ]; then
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth=1 origin "$GITHUB_SHA"
            git show FETCH_HEAD:runtime/wake.json > "$SEO_WAKE_FILE"
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth=1 origin main
          else
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth=1 origin "$GITHUB_SHA"
          fi
          git checkout --quiet FETCH_HEAD
          printf 'SEO_SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          unset auth
      - name: Validate isolated executor
        run: python3 -m unittest discover -s tests -v
      - name: Reconcile externally verified terminal status
        run: python3 supervisor.py --reconcile
      - name: Prepare useful SEO reviews and recover checkpoints
        if: github.event_name != 'push' || github.ref == 'refs/heads/seo-wake'
        run: |
          if [ "$GITHUB_REF" = refs/heads/seo-wake ] && python3 -c 'import json,os,sys;sys.exit(0 if json.load(open(os.environ["SEO_WAKE_FILE"]))["issued_at"] == 0 else 1)'; then
            echo 'Transport initialization; not an autonomous cycle.'
          else
            python3 supervisor.py
          fi
